name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    uses: halo-sigs/reusable-workflows/.github/workflows/plugin-ci.yaml@v5.0.1
    permissions:
      contents: read
    with:
      ui-path: "ui"
      pnpm-version: "10.12.4"
      node-version: "24"
      java-version: "21"
