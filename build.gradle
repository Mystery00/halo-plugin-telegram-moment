plugins {
    id 'java'
    id "io.freefair.lombok" version "8.13"
    id "run.halo.plugin.devtools" version "0.6.1"
}

group 'vip.mystery0.halo.telegrammoment'

repositories {
    mavenCentral()
}

// stub source set：仅用于编译，Moment.class 不进入 main output，
// 运行时由 moments 插件（pluginDependencies）的 classloader 提供
sourceSets {
    stub {
        java.srcDirs = ['src/stub/java']
    }
    main {
        compileClasspath += sourceSets.stub.output.classesDirs
    }
    test {
        compileClasspath += sourceSets.stub.output.classesDirs
        runtimeClasspath += sourceSets.stub.output.classesDirs
    }
}

// stub source set 继承 main 的依赖，确保编译时能找到 Halo API / Swagger 注解 / Lombok
configurations {
    stubImplementation.extendsFrom(implementation)
    stubCompileOnly.extendsFrom(compileOnly)
}

// stub 先于 main 编译
tasks.named('compileJava') {
    dependsOn('compileStubJava')
}
tasks.named('compileTestJava') {
    dependsOn('compileStubJava')
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.22.11')
    compileOnly 'run.halo.app:api'

    // Telegram Bot SDK
    implementation 'org.telegram:telegrambots-longpolling:7.11.0'
    implementation 'org.telegram:telegrambots-client:7.11.0'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.register('processUiResources', Copy) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/console')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}

halo {
    version = '2.22'
}

